# Keeps the Render free-tier service from sleeping.
#
# Render stops a free web service after 15 minutes without inbound
# traffic, and waking it means reloading the 2M-node road graph -- the
# first visitor after a quiet spell waits for that. A request every few
# minutes keeps it up.
#
# /status is the ping target because it is cheap: it touches no road
# search and triggers no Open-Meteo fetch, so pinging costs nothing
# against the rainfall quota.
#
# Every five minutes, not ten, because GitHub delays scheduled runs
# under load (worst around the top of the hour), and two late runs in
# a row at a ten-minute interval would miss Render's 15-minute window.
#
# Budget: one always-on service uses ~744 of Render's 750 free
# instance-hours in a 31-day month, so this only fits if it is the
# account's only free service. GitHub also disables scheduled
# workflows after 60 days with no repository activity.

name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /status
        # Retries cover a deploy in progress or a cold start still
        # loading the graph.
        run: >
          curl --fail --silent --show-error
          --max-time 120 --retry 3 --retry-delay 30 --retry-all-errors
          https://floodsafe-u207.onrender.com/status
